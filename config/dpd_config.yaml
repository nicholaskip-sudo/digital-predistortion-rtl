project:
  name: digital-predistortion-portfolio
  version: 0.2.0

algorithm:
  model: memory_polynomial
  memory_depth: 3
  polynomial_orders:
    - 1
    - 3
    - 5

sample_format:
  width: 16
  fractional_bits: 15
  signed: true

coefficient_format:
  width: 24
  fractional_bits: 16
  signed: true

interface:
  protocol: ready_valid
  complex_representation: separate_i_q
  reset_name: rst_n
  reset_active_low: true
  reset_asynchronous: true
  input_samples_per_clock: 1
  output_samples_per_clock: 1

verification:
  exact_integer_match: true
  long_regression_sample_count: 100000
